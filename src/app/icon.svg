<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0e261d" />
      <stop offset="70%" stop-color="#060e0a" />
      <stop offset="100%" stop-color="#020504" />
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="40%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="pupilGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="14" flood-color="#10b981" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Luxury Obsidian Rounded Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="16" />

  <!-- Lucide Eye Geometry -->
  <g transform="translate(46, 46) scale(17.5)" filter="url(#glow)">
    <path
      d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"
      fill="none"
      stroke="url(#strokeGrad)"
      stroke-width="2.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle
      cx="12"
      cy="12"
      r="3.2"
      fill="url(#pupilGrad)"
      stroke="#6ee7b7"
      stroke-width="0.75"
    />
    <circle
      cx="13.1"
      cy="10.9"
      r="0.9"
      fill="#ffffff"
      opacity="0.95"
    />
  </g>
</svg>